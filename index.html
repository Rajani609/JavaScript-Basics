<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marks Condition Check</title>
    <script>
        function checkMarks() {
            // Get the input value and convert it to a number
            let marks = parseFloat(document.getElementById("marksInput").value);
            let resultText = "";

            // Check if input is a valid number
            if (isNaN(marks) || marks < 0 || marks > 100) {
                resultText = "Please enter a valid number between 0 and 100.";
            } else if (marks >= 90) {
                resultText = "Grade: A (Excellent)";
            } else if (marks >= 75) {
                resultText = "Grade: B (Very Good)";
            } else if (marks >= 60) {
                resultText = "Grade: C (Good)";
            } else if (marks >= 40) {
                resultText = "Grade: D (Pass)";
            } else {
                resultText = "Grade: F (Fail)";
            }

            // Display the result
            document.getElementById("output").innerText = resultText;
        }
    </script>
</head>
<body>

    <label for="marksInput">Enter Marks (0-100):</label>
    <input type="number" id="marksInput" placeholder="Enter your marks">

    <button onclick="checkMarks()">Check Result</button>

    <p id="output"></p>

</body>

</html>
